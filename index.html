<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Låser fast vad sidan får ladda och prata med.

      connect-src har INGEN extern domän: ByteBox gör inga nätverksanrop alls
      (verifierat i e2e/no-external-requests.spec.ts). Även om ett beroende
      blev komprometterat kan det inte skicka användarens data någonstans.
      Lägg inte till en domän här utan att först fråga om verktyget verkligen
      hör hemma i ByteBox — se README.

      Undantaget är Text till tal, som använder webbläsarens egen
      SpeechSynthesis. Det går inte via connect-src och kan därför inte styras
      härifrån; verktyget säger själv vad det innebär.

      'unsafe-eval' krävs tyvärr av heic2any och pdf.js, som båda bygger
      funktioner med new Function() i sin Emscripten-kod. Utan den slutar
      HEIC-till-JPG och delar av PDF-verktyget att fungera.
      'wasm-unsafe-eval' krävs av pdf.js WebAssembly-moduler.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        media-src 'self' blob:;
        font-src 'self';
        worker-src 'self' blob:;
        child-src 'self' blob:;
        frame-src 'self';
        connect-src 'self' blob: data:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <link rel="icon" type="image/svg+xml" href="/bytebox/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/bytebox/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <link rel="apple-touch-icon" href="/bytebox/favicon.svg" />
    <title>Bytebox</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/bytebox/spa-redirect.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
